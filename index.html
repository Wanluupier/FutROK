<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>FutROK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    :root {
      --hdr: 44px; --bar: 52px; --foot: 0px;
      --fs-sm: 13px; --fs: 15px; --fs-lg: 19px; --fs-score: 26px; --fs-timer: 22px;
    }
    @media (min-height: 640px) and (min-width: 820px) {
      :root { --hdr: 62px; --bar: 66px; --foot: 0px; --fs-sm: 16px; --fs: 19px; --fs-lg: 26px; --fs-score: 40px; --fs-timer: 34px; }
    }
    @media (max-height: 430px) {
      :root { --hdr: 34px; --bar: 44px; --foot: 0px; --fs-sm: 12px; --fs: 14px; --fs-lg: 17px; --fs-score: 22px; --fs-timer: 19px; }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      width: 100%; min-height: 100dvh; margin: 0; padding: 0;
      background-color: #0d0d0d; color: #facc15;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }

    body.in-game {
      overflow: hidden !important;
      position: fixed; inset: 0;
      touch-action: none;
    }

    button, input, select { cursor: pointer; position: relative; z-index: 30; touch-action: auto; }
    input { cursor: text; user-select: text; }
    canvas { background-color: #1a1a1a; border: 0; box-shadow: 0 0 0 2px #facc15, 0 0 14px rgba(250, 204, 21, 0.25); }
    .btn-yellow { background-color: #facc15; color: #000; font-weight: 800; }
    .btn-yellow:hover { background-color: #eab308; }
    .btn-black { background-color: #000; color: #facc15; border: 2px solid #facc15; font-weight: 700; }
    .input-dark { background-color: #18181b; border: 2px solid #3f3f46; color: #fff; }
    .input-dark:focus { border-color: #facc15; outline: none; }

    .hbtn { font-size: var(--fs-sm); padding: 0 .8em; height: calc(var(--hdr) - 10px); border-radius: 10px; white-space: nowrap; }
    .card { background: #18181b; border: 2px solid rgba(250, 204, 21, 0.4); border-radius: 18px; padding: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
    .card h2 { font-size: var(--fs-lg); font-weight: 800; color: #facc15; border-bottom: 1px solid #27272a; padding-bottom: 6px; margin-bottom: 10px; }
    .lbl { display: block; font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .06em; color: #a1a1aa; margin-bottom: 4px; font-weight: 700; }
    .fld { width: 100%; font-size: max(16px, var(--fs)); padding: .5em .7em; border-radius: 12px; }
    .big-btn { width: 100%; font-size: var(--fs); padding: .7em .9em; border-radius: 14px; text-transform: uppercase; letter-spacing: .05em; }

    .room-card {
      display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 14px;
      background: linear-gradient(135deg, #1f1f23, #121214); border: 2px solid rgba(250, 204, 21, 0.35);
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .room-card:hover { border-color: #facc15; box-shadow: 0 0 14px rgba(250, 204, 21, 0.28); transform: translateY(-1px); }
    .room-badge {
      flex: none; width: 2.3em; height: 2.3em; border-radius: 12px; background: #facc15; color: #000;
      font-weight: 900; font-size: var(--fs); display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.2);
    }
    .room-name { font-size: var(--fs); font-weight: 800; color: #fff; line-height: 1.1; }
    .room-sub { font-size: var(--fs-sm); color: #a1a1aa; margin-top: 2px; font-weight: 600; }
    .room-go { flex: none; font-size: var(--fs-sm); padding: .55em 1.2em; border-radius: 10px; text-transform: uppercase; letter-spacing: .06em; }

    .bar { height: var(--bar); }
    .team-name { font-size: var(--fs); font-weight: 800; }
    .score { font-size: var(--fs-score); font-weight: 900; color: #fff; line-height: 1; padding: 0 .25em; }
    .timer { font-size: var(--fs-timer); font-weight: 900; font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; }
    .pbtn { font-size: var(--fs-sm); padding: .4em 1em; border-radius: 10px; font-weight: 800; display: flex; align-items: center; gap: 6px; white-space: nowrap; }

    /* JOYSTICK MAIOR E MAIS CONFORTÁVEL NO CELULAR */
    #joystickBase {
      position: absolute; left: clamp(20px, 8%, 100px); bottom: 16px;
      width: clamp(76px, 22vmin, 105px); height: clamp(76px, 22vmin, 105px); border-radius: 50%;
      background: rgba(250, 204, 21, 0.12); border: 3px solid rgba(250, 204, 21, 0.45);
      display: none; z-index: 20; touch-action: none;
    }
    #joystickBase::before { content: ""; position: absolute; inset: -20px; }
    #joystickStick {
      position: absolute; width: 42%; height: 42%; top: 29%; left: 29%; border-radius: 50%;
      background: rgba(250, 204, 21, 0.45); border: 2px solid rgba(250, 204, 21, 0.7); pointer-events: none;
    }

    /* BOTÃO CHUTAR MAIOR E MAIS FÁCIL DE APERTAR */
    #touchKickBtn {
      position: absolute; right: clamp(16px, 6%, 90px); bottom: 16px;
      width: clamp(62px, 18vmin, 80px); height: clamp(62px, 18vmin, 80px); border-radius: 50%;
      background: rgba(250, 204, 21, 0.18); border: 3px solid rgba(250, 204, 21, 0.5); display: none;
      align-items: center; justify-content: center; color: rgba(250, 204, 21, 0.95);
      font-weight: 900; font-size: clamp(10px, 3vmin, 13px); z-index: 20; user-select: none; touch-action: none;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.2);
    }
    #touchKickBtn::before { content: ""; position: absolute; inset: -16px; }
    #touchKickBtn.on { background: rgba(250, 204, 21, 0.55); color: #000; }

    .drawer { font-size: var(--fs-sm); z-index: 9999 !important; max-height: 460px; }
    #notificationModal { z-index: 999999 !important; }

    #lobbyScreen { overflow-y: visible !important; touch-action: pan-y !important; -webkit-overflow-scrolling: touch; }
    body { padding: max(4px, env(safe-area-inset-top)) max(4px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left)) !important; }
    .timer, .score, .pbtn { white-space: nowrap; }

    @media (max-width: 720px) {
      :root { --fs-sm: 11px; --fs: 13px; --fs-lg: 16px; --fs-score: 20px; --fs-timer: 16px; --bar: 58px; --hdr: 38px; }
      .bar { height: auto !important; min-height: var(--bar); padding: 4px 6px !important; flex-wrap: wrap; gap: 4px; justify-content: center !important; }
      .bar > div:first-child, .bar > div:last-child { flex: 1 1 45% !important; justify-content: center !important; }
      .bar > div.shrink-0 { order: -1; width: 100%; text-align: center; margin-bottom: 2px; }
      header { justify-content: space-between !important; }
      header h1 { position: static !important; transform: none !important; font-size: 17px !important; }
      .hlabel, .btn-label, .tname { display: none !important; }
      .hbtn { padding: 0 .6em; }
      .pbtn { padding: .35em .7em; }
      .card { padding: 10px; border-radius: 14px; }
      .room-card { padding: 6px 10px; gap: 10px; }
      .timer { letter-spacing: .02em; }
      .score { padding: 0 .1em; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      #lobbyGrid { grid-template-columns: 1fr 1fr !important; }
      #lobbyGrid > section { order: 2 !important; }
      #lobbyGrid > div { order: 1 !important; }
    }
  </style>
</head>
<body class="w-full min-h-dvh flex flex-col p-1">

  <div id="notificationModal" class="hidden fixed inset-0 bg-black/95 flex flex-col items-center justify-center p-4">
    <div class="bg-zinc-900 border-2 border-yellow-400 p-6 rounded-2xl text-center max-w-md w-full shadow-2xl">
      <p id="notificationText" class="font-bold text-white mb-5 tracking-wide" style="font-size: var(--fs-lg)"></p>
      <button onclick="window.closeNotificationModal()" class="w-full py-3 rounded-xl btn-yellow uppercase tracking-wider" style="font-size: var(--fs)">OK</button>
    </div>
  </div>

  <div id="connectingToast" class="hidden fixed top-3 left-1/2 -translate-x-1/2 bg-zinc-900 border-2 border-yellow-400 text-yellow-400 font-bold rounded-xl px-5 py-2 shadow-2xl" style="z-index: 999998; font-size: var(--fs)">Conectando...</div>

  <header class="relative w-full max-w-[1800px] mx-auto flex items-center justify-end px-2 shrink-0" style="height: var(--hdr)">
    <h1 class="absolute left-1/2 -translate-x-1/2 font-extrabold tracking-wider text-yellow-400 uppercase" style="font-size: calc(var(--fs-lg) * 1.35)">FutROK</h1>
    <div class="flex gap-2 items-center z-30">
      <button onclick="window.toggleFullScreen()" class="hbtn btn-black">⛶<span class="hlabel"> Tela Cheia</span></button>
      <button id="btnToggleAudio" onclick="window.toggleAudioSystem()" class="hbtn btn-black">🔊 <span id="audioStatusText">Off</span></button>
      <button id="btnToggleSfx" onclick="window.toggleSfxSystem()" class="hbtn btn-black">⚽ <span id="sfxStatusText">On</span></button>
    </div>
  </header>

  <!-- LOBBY -->
  <div id="lobbyScreen" class="w-full max-w-6xl mx-auto grow p-2 pb-12 flex flex-col">
    <div id="lobbyGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start w-full my-auto">

      <section class="card order-1 lg:order-2 flex flex-col">
        <h2>Salas Públicas</h2>
        <div id="roomList" class="flex flex-col gap-2"></div>
      </section>

      <div class="order-2 lg:order-1 flex flex-col gap-4">
        <section class="card">
          <h2>Criar Sala Particular</h2>
          <div class="space-y-3">
            <div>
              <label class="lbl">Nome da Sala</label>
              <input type="text" id="roomNameInput" maxlength="15" placeholder="Nome..." class="fld input-dark">
            </div>
            <div>
              <label class="lbl">Seu Nick</label>
              <input type="text" id="playerNameInput" maxlength="15" placeholder="Nick..." class="fld input-dark">
            </div>
            <button id="btnCreateRoomAction" onclick="window.confirmCreateRoom()" class="big-btn btn-yellow">Criar Sala Particular</button>
          </div>
        </section>

        <section class="card">
          <h2>Entrar em Sala Particular</h2>
          <div class="flex gap-3">
            <input type="text" id="joinCodeInput" maxlength="3" inputmode="numeric" class="fld input-dark text-center font-mono tracking-widest" style="width: 6.5em; flex: none" placeholder="000">
            <button id="btnJoinCodeAction" onclick="window.joinByCode()" class="big-btn btn-yellow" style="width: auto; flex: 1">Entrar por Código</button>
          </div>
        </section>
      </div>

    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden w-full max-w-[1800px] mx-auto flex flex-col grow min-h-0 relative">

    <div class="bar w-full bg-zinc-900 border-2 border-yellow-400/50 rounded-xl px-3 mb-1 flex items-center justify-between shrink-0 relative z-30 shadow-lg">
      <div class="flex items-center gap-2 grow basis-0 justify-start min-w-0">
        <button onclick="window.toggleChatDrawer()" class="pbtn btn-yellow shadow-md">
          💬 <span class="btn-label">Chat</span> <span id="chatBadge" class="hidden w-3 h-3 rounded-full bg-red-600 inline-block"></span>
        </button>
        <div class="flex items-center gap-1.5 ml-1">
          <span class="w-3 h-3 rounded-full bg-yellow-400 inline-block border border-black"></span>
          <span class="team-name tname text-yellow-400">AMARELO</span>
          <span id="scoreYellow" class="score">0</span>
        </div>
      </div>

      <div class="shrink-0 px-2 text-center flex flex-col items-center">
        <span id="gameTimer" class="timer text-yellow-400 leading-none">05:00</span>
        <div class="flex items-center gap-2 mt-0.5" style="font-size: var(--fs-sm)">
          <span id="roomTitleDisplay" class="text-zinc-300 font-bold truncate max-w-[120px]"></span>
          <span id="roomCodeDisplay" class="hidden text-yellow-400 font-mono font-bold tracking-wider">CÓD: <span id="roomCodeText" class="text-white"></span></span>
          <span id="pingDisplay" class="text-yellow-400 font-bold"></span>
        </div>
      </div>

      <div class="flex items-center gap-2 grow basis-0 justify-end min-w-0">
        <div class="flex items-center gap-1.5 mr-1">
          <span id="scoreBlack" class="score">0</span>
          <span class="team-name tname text-zinc-300">PRETO</span>
          <span class="w-3 h-3 rounded-full bg-black inline-block border border-yellow-400"></span>
        </div>
        <button onclick="window.togglePlayersDrawer()" class="pbtn btn-yellow shadow-md">👥 <span class="btn-label">Jogadores</span></button>
        <button id="btnLeaveGameAction" onclick="window.leaveRoom()" class="pbtn bg-red-600 hover:bg-red-700 text-white shadow-md font-extrabold uppercase">Sair</button>
      </div>
    </div>

    <div id="canvasContainer" class="relative w-full flex justify-center bg-zinc-950 border-2 border-yellow-400/40 rounded-xl grow min-h-0 items-center overflow-hidden">
      <canvas id="gameCanvas"></canvas>

      <div id="joystickBase"><div id="joystickStick"></div></div>
      <div id="touchKickBtn">CHUTAR</div>

      <div id="chatDrawer" class="drawer hidden absolute top-2 left-2 bottom-2 w-[min(92%,400px)] bg-zinc-900 border-2 border-yellow-400 rounded-xl shadow-2xl flex flex-col p-3">
        <div class="flex items-center justify-between border-b border-zinc-700 pb-2 mb-2 shrink-0">
          <span class="font-bold text-yellow-400 uppercase tracking-wider" style="font-size: var(--fs)">Chat da Partida</span>
          <button onclick="window.toggleChatDrawer()" class="text-zinc-300 hover:text-white font-bold px-2.5 py-1 bg-zinc-800 rounded-lg" style="font-size: var(--fs-sm)">✕</button>
        </div>
        <div id="chatMessagesList" class="grow overflow-y-auto space-y-1 pr-1 text-zinc-200 font-sans mb-2">
          <div class="text-zinc-500 italic text-center">Nenhuma mensagem ainda...</div>
        </div>
        <div class="flex gap-2 shrink-0">
          <input type="text" id="chatInput" maxlength="1000" placeholder="Digite sua mensagem..." class="flex-1 min-w-0 px-3 py-2 rounded-lg input-dark" style="font-size: max(16px, var(--fs-sm))" onkeydown="if(event.key==='Enter') window.sendChatMessage()">
          <button onclick="window.sendChatMessage()" class="px-4 py-2 rounded-lg btn-yellow font-bold" style="font-size: var(--fs-sm)">Enviar</button>
        </div>
      </div>

      <div id="playersDrawer" class="drawer hidden absolute top-2 right-2 bottom-2 w-[min(92%,400px)] bg-zinc-900 border-2 border-yellow-400 rounded-xl shadow-2xl flex flex-col p-3">
        <div class="flex items-center justify-between border-b border-zinc-700 pb-2 mb-2 shrink-0">
          <span class="font-bold text-yellow-400 uppercase tracking-wider" style="font-size: var(--fs)">Jogadores na Sala</span>
          <button onclick="window.togglePlayersDrawer()" class="text-zinc-300 hover:text-white font-bold px-2.5 py-1 bg-zinc-800 rounded-lg" style="font-size: var(--fs-sm)">✕</button>
        </div>
        <div id="playersManagementList" class="grow overflow-y-auto space-y-2 pr-1 text-zinc-200 font-sans"></div>
      </div>

      <div id="victoryModal" class="hidden absolute inset-0 bg-black/85 backdrop-blur-sm flex flex-col items-center justify-center z-40">
        <div class="bg-zinc-900 border-2 border-yellow-400 p-5 rounded-2xl text-center max-w-md shadow-2xl">
          <p id="victoryMessage" class="font-black tracking-wide mb-4 uppercase" style="font-size: var(--fs-lg)"></p>
          <button id="btnVictoryExitAction" onclick="window.leaveRoom()" class="w-full py-3 rounded-xl btn-yellow uppercase tracking-wider" style="font-size: var(--fs)">Voltar ao Menu</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    try {
      const old = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('futrok_banned_')) old.push(k); }
      old.forEach(k => localStorage.removeItem(k));
    } catch (e) {}

    document.addEventListener('touchmove', function (e) {
      if (document.body.classList.contains('in-game')) {
        if (!e.target.closest('#chatDrawer') && !e.target.closest('#playersDrawer')) {
          e.preventDefault();
        }
      }
    }, { passive: false });

    const FIELD = { w: 800, h: 460, goal: 110 };
    const PH = { r: 16, accel: 0.1, damp: 0.96, inv: 0.5, bc: 0.5, kick: 5, range: 5 };
    const BL = { r: 10, damp: 0.99, inv: 1, bc: 0.5, wall: 0.6 };
    const STEP = 1000 / 60;
    const MAX_SCORE = 10, MATCH_SECS = 300, GOAL_PAUSE = 72;
    const ZERO_IN = { x: 0, y: 0, k: 0 };
    const r2 = v => Math.round(v * 100) / 100;

    function newState() {
      return { players: {}, ball: { x: FIELD.w / 2, y: FIELD.h / 2, vx: 0, vy: 0, hid: 0 }, score: [0, 0], timeLeft: MATCH_SECS, over: 0, secT: 0, resetIn: 0 };
    }
    function newPlayer(team) {
      return { x: team === 0 ? FIELD.w * 0.25 : FIELD.w * 0.75, y: FIELD.h / 2, vx: 0, vy: 0, ix: 0, iy: 0, kl: 0 };
    }
    function finishState(S) { S.over = S.score[0] > S.score[1] ? 1 : (S.score[1] > S.score[0] ? 2 : 3); }

    function collide(a, ra, ia, ca, b, rb, ib, cb) {
      let dx = b.x - a.x, dy = b.y - a.y;
      const rs = ra + rb, d2 = dx * dx + dy * dy;
      if (d2 > rs * rs) return 0;
      const d = Math.sqrt(d2);
      const nx = d > 0 ? dx / d : 1, ny = d > 0 ? dy / d : 0;
      const mf = ia / (ia + ib), pen = rs - d;
      a.x -= nx * pen * mf; a.y -= ny * pen * mf;
      b.x += nx * pen * (1 - mf); b.y += ny * pen * (1 - mf);
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv < 0) {
        const j = rv * (ca * cb + 1);
        a.vx += nx * j * mf; a.vy += ny * j * mf;
        b.vx -= nx * j * (1 - mf); b.vy -= ny * j * (1 - mf);
        return -rv;
      }
      return 0;
    }

    function stepSim(S, ins, auth, ev) {
      if (S.over) return;
      const B = S.ball, ids = Object.keys(S.players), P = ids.map(id => S.players[id]);
      const gt = (FIELD.h - FIELD.goal) / 2, gb = gt + FIELD.goal;

      for (let i = 0; i < P.length; i++) {
        const p = P[i], inp = ins[ids[i]] || ZERO_IN;
        let x = +inp.x || 0, y = +inp.y || 0;
        const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
        p.ix = x; p.iy = y;
        p.vx += x * PH.accel; p.vy += y * PH.accel;
        if (!inp.k) p.kl = 0;
        else if (!p.kl && !B.hid) {
          const dx = B.x - p.x, dy = B.y - p.y, d = Math.hypot(dx, dy);
          if (d <= PH.r + BL.r + PH.range) {
            const nx = d > 0 ? dx / d : 1, ny = d > 0 ? dy / d : 0;
            B.vx += nx * PH.kick * BL.inv; B.vy += ny * PH.kick * BL.inv;
            p.kl = 1;
            if (ev && ev.kick) ev.kick(ids[i]);
          }
        }
      }
      for (const p of P) { p.x += p.vx; p.y += p.vy; p.vx *= PH.damp; p.vy *= PH.damp; }
      if (!B.hid) { B.x += B.vx; B.y += B.vy; B.vx *= BL.damp; B.vy *= BL.damp; }

      for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) collide(P[i], PH.r, PH.inv, PH.bc, P[j], PH.r, PH.inv, PH.bc);
      if (!B.hid) for (const p of P) collide(p, PH.r, PH.inv, PH.bc, B, BL.r, BL.inv, BL.bc);

      for (const p of P) {
        if (p.x < PH.r) { p.x = PH.r; if (p.vx < 0) p.vx = 0; }
        if (p.x > FIELD.w - PH.r) { p.x = FIELD.w - PH.r; if (p.vx > 0) p.vx = 0; }
        if (p.y < PH.r) { p.y = PH.r; if (p.vy < 0) p.vy = 0; }
        if (p.y > FIELD.h - PH.r) { p.y = FIELD.h - PH.r; if (p.vy > 0) p.vy = 0; }
      }

      if (!B.hid) {
        let goalFor = -1;
        if (B.y - BL.r < 0) { B.y = BL.r; if (B.vy < 0) { if (ev && ev.bounce) ev.bounce(-B.vy); B.vy *= -BL.wall; } }
        if (B.y + BL.r > FIELD.h) { B.y = FIELD.h - BL.r; if (B.vy > 0) { if (ev && ev.bounce) ev.bounce(B.vy); B.vy *= -BL.wall; } }
        if (B.x - BL.r < 0) {
          if (B.y > gt && B.y < gb) goalFor = 1;
          else { B.x = BL.r; if (B.vx < 0) { if (ev && ev.bounce) ev.bounce(-B.vx); B.vx *= -BL.wall; } }
        }
        if (B.x + BL.r > FIELD.w) {
          if (B.y > gt && B.y < gb) goalFor = 0;
          else { B.x = FIELD.w - BL.r; if (B.vx > 0) { if (ev && ev.bounce) ev.bounce(B.vx); B.vx *= -BL.wall; } }
        }
        if (goalFor >= 0) {
          B.hid = 1; B.vx = 0; B.vy = 0;
          if (auth) {
            S.score[goalFor]++; S.resetIn = GOAL_PAUSE;
            if (ev && ev.goal) ev.goal(goalFor);
            if (S.score[goalFor] >= MAX_SCORE) finishState(S);
          }
        }
      }

      if (auth && !S.over) {
        if (B.hid && S.resetIn > 0 && --S.resetIn === 0) { B.x = FIELD.w / 2; B.y = FIELD.h / 2; B.vx = 0; B.vy = 0; B.hid = 0; }
