<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FutROK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    :root {
      --hdr: 44px; --bar: 48px; --foot: 30px;
      --fs-sm: 13px; --fs: 15px; --fs-lg: 19px; --fs-score: 26px; --fs-timer: 22px;
    }
    @media (min-height: 640px) and (min-width: 820px) {
      :root { --hdr: 62px; --bar: 66px; --foot: 40px; --fs-sm: 16px; --fs: 19px; --fs-lg: 26px; --fs-score: 40px; --fs-timer: 34px; }
    }
    @media (max-height: 430px) {
      :root { --hdr: 34px; --bar: 40px; --foot: 26px; --fs-sm: 12px; --fs: 14px; --fs-lg: 17px; --fs-score: 22px; --fs-timer: 19px; }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    html, body {
      width: 100vw; height: 100dvh; margin: 0; padding: 0; overflow: hidden !important;
      position: fixed; inset: 0; background-color: #0d0d0d; color: #facc15;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; touch-action: none;
    }
    button, input, select { cursor: pointer; position: relative; z-index: 30; touch-action: auto; }
    input { cursor: text; user-select: text; }
    canvas { background-color: #1a1a1a; border: 0; box-shadow: 0 0 0 2px #facc15, 0 0 14px rgba(250, 204, 21, 0.25); }
    .btn-yellow { background-color: #facc15; color: #000; font-weight: 800; }
    .btn-yellow:hover { background-color: #eab308; }
    .btn-black { background-color: #000; color: #facc15; border: 2px solid #facc15; font-weight: 700; }
    .input-dark { background-color: #18181b; border: 2px solid #3f3f46; color: #fff; }
    .input-dark:focus { border-color: #facc15; outline: none; }

    .hbtn { font-size: var(--fs-sm); padding: 0 .8em; height: calc(var(--hdr) - 10px); border-radius: 10px; white-space: nowrap; }
    .card { background: #18181b; border: 2px solid rgba(250, 204, 21, 0.4); border-radius: 18px; padding: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
    .card h2 { font-size: var(--fs-lg); font-weight: 800; color: #facc15; border-bottom: 1px solid #27272a; padding-bottom: 6px; margin-bottom: 10px; }
    .lbl { display: block; font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .06em; color: #a1a1aa; margin-bottom: 4px; font-weight: 700; }
    .fld { width: 100%; font-size: max(16px, var(--fs)); padding: .5em .7em; border-radius: 12px; }
    .big-btn { width: 100%; font-size: var(--fs); padding: .7em .9em; border-radius: 14px; text-transform: uppercase; letter-spacing: .05em; }

    /* 5 salas públicas perfeitamente ajustadas sem precisar de scroll */
    .room-card {
      display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 14px;
      background: linear-gradient(135deg, #1f1f23, #121214); border: 2px solid rgba(250, 204, 21, 0.35);
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .room-card:hover { border-color: #facc15; box-shadow: 0 0 14px rgba(250, 204, 21, 0.28); transform: translateY(-1px); }
    .room-badge {
      flex: none; width: 2.3em; height: 2.3em; border-radius: 12px; background: #facc15; color: #000;
      font-weight: 900; font-size: var(--fs); display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.2);
    }
    .room-name { font-size: var(--fs); font-weight: 800; color: #fff; line-height: 1.1; }
    .room-sub { font-size: var(--fs-sm); color: #a1a1aa; margin-top: 2px; font-weight: 600; }
    .room-go { flex: none; font-size: var(--fs-sm); padding: .55em 1.2em; border-radius: 10px; text-transform: uppercase; letter-spacing: .06em; }

    .bar { height: var(--bar); }
    .foot { height: var(--foot); }
    .team-name { font-size: var(--fs); font-weight: 800; }
    .score { font-size: var(--fs-score); font-weight: 900; color: #fff; line-height: 1; padding: 0 .25em; }
    .timer { font-size: var(--fs-timer); font-weight: 900; font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; }
    .pbtn { font-size: var(--fs-sm); padding: .35em .9em; border-radius: 10px; font-weight: 800; display: flex; align-items: center; gap: 6px; white-space: nowrap; }

    #joystickBase {
      position: absolute; left: clamp(24px, 8%, 120px); bottom: 12px;
      width: clamp(60px, 17vmin, 84px); height: clamp(60px, 17vmin, 84px); border-radius: 50%;
      background: rgba(250, 204, 21, 0.07); border: 2px solid rgba(250, 204, 21, 0.28);
      display: none; z-index: 20; touch-action: none;
    }
    #joystickBase::before { content: ""; position: absolute; inset: -18px; }  /* área de toque maior que o desenho */
    #joystickStick {
      position: absolute; width: 40%; height: 40%; top: 30%; left: 30%; border-radius: 50%;
      background: rgba(250, 204, 21, 0.32); border: 2px solid rgba(250, 204, 21, 0.5); pointer-events: none;
    }
    #touchKickBtn {
      position: absolute; right: clamp(16px, 5%, 90px); bottom: 12px;
      width: clamp(46px, 13vmin, 62px); height: clamp(46px, 13vmin, 62px); border-radius: 50%;
      background: rgba(250, 204, 21, 0.10); border: 2px solid rgba(250, 204, 21, 0.32); display: none;
      align-items: center; justify-content: center; color: rgba(250, 204, 21, 0.6);
      font-weight: 900; font-size: 9px; z-index: 20; user-select: none; touch-action: none;
    }
    #touchKickBtn::before { content: ""; position: absolute; inset: -12px; }
    #touchKickBtn.on { background: rgba(250, 204, 21, 0.35); }
    .drawer { font-size: var(--fs-sm); z-index: 9999 !important; max-height: 460px; }
    #notificationModal { z-index: 999999 !important; }

    /* lobby rolável no celular */
    #lobbyScreen { overflow-y: auto; overflow-x: hidden; touch-action: pan-y; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    body { padding: max(4px, env(safe-area-inset-top)) max(4px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left)) !important; }
    #roomCodeFoot { display: none; }
    .timer, .score, .pbtn { white-space: nowrap; }
    @media (max-width: 720px) {
      :root { --fs-sm: 12px; --fs: 14px; --fs-lg: 17px; --fs-score: 22px; --fs-timer: 18px; --bar: 42px; --hdr: 38px; --foot: 30px; }
      header { justify-content: space-between !important; }
      header h1 { position: static !important; transform: none !important; font-size: 17px !important; }
      .hlabel, .btn-label, .tname { display: none !important; }
      .hbtn { padding: 0 .6em; }
      .pbtn { padding: .4em .6em; }
      .card { padding: 10px; border-radius: 14px; }
      .room-card { padding: 6px 10px; gap: 10px; }
      #roomCodeDisplay { display: none !important; }
      #roomCodeFoot { display: inline; }
      .timer { letter-spacing: .02em; }
      .score { padding: 0 .1em; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      #lobbyGrid { grid-template-columns: 1fr 1fr !important; }
      #lobbyGrid > section { order: 2 !important; }
      #lobbyGrid > div { order: 1 !important; }
    }
  </style>
</head>
<body class="w-full h-full flex flex-col p-1 overflow-hidden">

  <!-- Modal de Notificação -->
  <div id="notificationModal" class="hidden fixed inset-0 bg-black/95 flex flex-col items-center justify-center p-4">
    <div class="bg-zinc-900 border-2 border-yellow-400 p-6 rounded-2xl text-center max-w-md w-full shadow-2xl">
      <p id="notificationText" class="font-bold text-white mb-5 tracking-wide" style="font-size: var(--fs-lg)"></p>
      <button onclick="window.closeNotificationModal()" class="w-full py-3 rounded-xl btn-yellow uppercase tracking-wider" style="font-size: var(--fs)">OK</button>
    </div>
  </div>

  <div id="connectingToast" class="hidden fixed top-3 left-1/2 -translate-x-1/2 bg-zinc-900 border-2 border-yellow-400 text-yellow-400 font-bold rounded-xl px-5 py-2 shadow-2xl" style="z-index: 999998; font-size: var(--fs)">Conectando...</div>

  <!-- Header -->
  <header class="relative w-full max-w-[1800px] mx-auto flex items-center justify-end px-2 shrink-0" style="height: var(--hdr)">
    <h1 class="absolute left-1/2 -translate-x-1/2 font-extrabold tracking-wider text-yellow-400 uppercase" style="font-size: calc(var(--fs-lg) * 1.35)">FutROK</h1>
    <div class="flex gap-2 items-center z-30">
      <button onclick="window.toggleFullScreen()" class="hbtn btn-black">⛶<span class="hlabel"> Tela Cheia</span></button>
      <button id="btnToggleAudio" onclick="window.toggleAudioSystem()" class="hbtn btn-black">🔊 <span id="audioStatusText">Off</span></button>
      <button id="btnToggleSfx" onclick="window.toggleSfxSystem()" class="hbtn btn-black">⚽ <span id="sfxStatusText">On</span></button>
    </div>
  </header>

  <!-- LOBBY -->
  <div id="lobbyScreen" class="w-full max-w-6xl mx-auto grow min-h-0 p-2 flex">
    <div id="lobbyGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start w-full my-auto">

      <!-- Salas públicas (exatamente 5 salas, sem scroll) -->
      <section class="card order-1 lg:order-2 flex flex-col">
        <h2>Salas Públicas</h2>
        <div id="roomList" class="flex flex-col gap-2"></div>
      </section>

      <div class="order-2 lg:order-1 flex flex-col gap-4">
        <section class="card">
          <h2>Criar Sala Particular</h2>
          <div class="space-y-3">
            <div>
              <label class="lbl">Nome da Sala</label>
              <input type="text" id="roomNameInput" maxlength="15" placeholder="Nome..." class="fld input-dark">
            </div>
            <div>
              <label class="lbl">Seu Nick</label>
              <input type="text" id="playerNameInput" maxlength="15" placeholder="Nick..." class="fld input-dark">
            </div>
            <button id="btnCreateRoomAction" onclick="window.confirmCreateRoom()" class="big-btn btn-yellow">Criar Sala Particular</button>
          </div>
        </section>

        <section class="card">
          <h2>Entrar em Sala Particular</h2>
          <div class="flex gap-3">
            <input type="text" id="joinCodeInput" maxlength="3" inputmode="numeric" class="fld input-dark text-center font-mono tracking-widest" style="width: 6.5em; flex: none" placeholder="000">
            <button id="btnJoinCodeAction" onclick="window.joinByCode()" class="big-btn btn-yellow" style="width: auto; flex: 1">Entrar por Código</button>
          </div>
        </section>
      </div>

    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden w-full max-w-[1800px] mx-auto flex flex-col grow min-h-0 relative">

    <!-- Placar -->
    <div class="bar w-full bg-zinc-900 border-2 border-yellow-400/40 rounded-t-xl px-2 flex items-center justify-between shrink-0 relative z-30">
      <div class="flex items-center gap-2 grow basis-0 justify-start min-w-0">
        <button onclick="window.toggleChatDrawer()" class="pbtn btn-yellow shadow-md">
          💬 <span class="btn-label">Chat</span> <span id="chatBadge" class="hidden w-3 h-3 rounded-full bg-red-600 inline-block"></span>
        </button>
        <div class="flex items-center gap-1.5 ml-auto mr-2">
          <span class="w-3 h-3 rounded-full bg-yellow-400 inline-block border border-black"></span>
          <span class="team-name tname text-yellow-400">AMARELO</span>
          <span id="scoreYellow" class="score">0</span>
        </div>
      </div>

      <div class="shrink-0 px-2 text-center">
        <span id="gameTimer" class="timer text-yellow-400 leading-none">05:00</span>
      </div>

      <div class="flex items-center gap-2 grow basis-0 justify-end min-w-0">
        <div class="flex items-center gap-1.5 mr-auto ml-2">
          <span id="scoreBlack" class="score">0</span>
          <span class="team-name tname text-zinc-300">PRETO</span>
          <span class="w-3 h-3 rounded-full bg-black inline-block border border-yellow-400"></span>
        </div>
        <div id="roomCodeDisplay" class="hidden items-center gap-1 font-mono text-yellow-400 tracking-wider bg-zinc-800 px-2 py-1 rounded-lg border border-yellow-400/40" style="font-size: var(--fs-sm)">
          <span>CÓDIGO:</span><span id="roomCodeText" class="font-bold text-white"></span>
        </div>
        <button onclick="window.togglePlayersDrawer()" class="pbtn btn-yellow shadow-md">👥 <span class="btn-label">Jogadores</span></button>
      </div>
    </div>

    <!-- Campo -->
    <div id="canvasContainer" class="relative w-full flex justify-center bg-zinc-950 border-x-2 border-yellow-400/40 grow min-h-0 items-center overflow-hidden">
      <canvas id="gameCanvas"></canvas>

      <div id="joystickBase"><div id="joystickStick"></div></div>
      <div id="touchKickBtn">CHUTAR</div>

      <!-- CHAT -->
      <div id="chatDrawer" class="drawer hidden absolute top-2 left-2 bottom-2 w-[min(92%,400px)] bg-zinc-900 border-2 border-yellow-400 rounded-xl shadow-2xl flex flex-col p-3">
        <div class="flex items-center justify-between border-b border-zinc-700 pb-2 mb-2 shrink-0">
          <span class="font-bold text-yellow-400 uppercase tracking-wider" style="font-size: var(--fs)">Chat da Partida</span>
          <button onclick="window.toggleChatDrawer()" class="text-zinc-300 hover:text-white font-bold px-2.5 py-1 bg-zinc-800 rounded-lg" style="font-size: var(--fs-sm)">✕</button>
        </div>
        <div id="chatMessagesList" class="grow overflow-y-auto space-y-1 pr-1 text-zinc-200 font-sans mb-2">
          <div class="text-zinc-500 italic text-center">Nenhuma mensagem ainda...</div>
        </div>
        <div class="flex gap-2 shrink-0">
          <input type="text" id="chatInput" maxlength="1000" placeholder="Digite sua mensagem..." class="flex-1 min-w-0 px-3 py-2 rounded-lg input-dark" style="font-size: max(16px, var(--fs-sm))" onkeydown="if(event.key==='Enter') window.sendChatMessage()">
          <button onclick="window.sendChatMessage()" class="px-4 py-2 rounded-lg btn-yellow font-bold" style="font-size: var(--fs-sm)">Enviar</button>
        </div>
      </div>

      <!-- JOGADORES -->
      <div id="playersDrawer" class="drawer hidden absolute top-2 right-2 bottom-2 w-[min(92%,400px)] bg-zinc-900 border-2 border-yellow-400 rounded-xl shadow-2xl flex flex-col p-3">
        <div class="flex items-center justify-between border-b border-zinc-700 pb-2 mb-2 shrink-0">
          <span class="font-bold text-yellow-400 uppercase tracking-wider" style="font-size: var(--fs)">Jogadores na Sala</span>
          <button onclick="window.togglePlayersDrawer()" class="text-zinc-300 hover:text-white font-bold px-2.5 py-1 bg-zinc-800 rounded-lg" style="font-size: var(--fs-sm)">✕</button>
        </div>
        <div id="playersManagementList" class="grow overflow-y-auto space-y-2 pr-1 text-zinc-200 font-sans"></div>
      </div>

      <div id="victoryModal" class="hidden absolute inset-0 bg-black/85 backdrop-blur-sm flex flex-col items-center justify-center z-40">
        <div class="bg-zinc-900 border-2 border-yellow-400 p-5 rounded-2xl text-center max-w-md shadow-2xl">
          <p id="victoryMessage" class="font-black tracking-wide mb-4 uppercase" style="font-size: var(--fs-lg)"></p>
          <button id="btnVictoryExitAction" onclick="window.leaveRoom()" class="w-full py-3 rounded-xl btn-yellow uppercase tracking-wider" style="font-size: var(--fs)">Voltar ao Menu</button>
        </div>
      </div>
    </div>

    <!-- Rodapé da partida -->
    <div class="foot w-full bg-zinc-900 border-2 border-yellow-400/40 rounded-b-xl px-3 flex items-center justify-between shrink-0 z-30">
      <span class="text-zinc-300 font-mono flex items-center gap-3 min-w-0" style="font-size: var(--fs-sm)">
        <span id="roomTitleDisplay" class="truncate"></span>
        <span id="roomCodeFoot" class="text-white font-bold shrink-0"></span>
        <span id="pingDisplay" class="text-yellow-400 font-bold"></span>
      </span>
      <button id="btnLeaveGameAction" onclick="window.leaveRoom()" class="px-4 rounded-lg bg-red-600 hover:bg-red-700 text-white font-bold shadow-md" style="font-size: var(--fs-sm); height: 80%">Sair da Sala</button>
    </div>
  </div>

  <!-- Footer do lobby -->
  <footer id="mainFooter" class="text-center text-zinc-400 font-mono tracking-wider shrink-0 flex items-center justify-center font-bold z-30" style="height: var(--foot); font-size: var(--fs-sm)">
  </footer>

  <script>
    try {
      const old = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('futrok_banned_')) old.push(k); }
      old.forEach(k => localStorage.removeItem(k));
    } catch (e) {}

    document.addEventListener('touchmove', function (e) {
      if (!e.target.closest('#lobbyScreen') && !e.target.closest('#chatDrawer') && !e.target.closest('#playersDrawer')) e.preventDefault();
    }, { passive: false });

    /* ==========================================================================================
       NÚCLEO (física + sincronização). Sem DOM: roda igual no host e no cliente.
       Física no estilo HaxBall: passo fixo de 60 Hz, colisão de discos com massa/elasticidade.
       ========================================================================================== */
    /* CORE-START */
    const FIELD = { w: 800, h: 460, goal: 110 };
    const PH = { r: 16, accel: 0.1, damp: 0.96, inv: 0.5, bc: 0.5, kick: 5, range: 5 };   // jogador
    const BL = { r: 10, damp: 0.99, inv: 1, bc: 0.5, wall: 0.6 };                          // bola
    const STEP = 1000 / 60;
    const MAX_SCORE = 10, MATCH_SECS = 300, GOAL_PAUSE = 72;   // 72 ticks = 1,2 s
    const ZERO_IN = { x: 0, y: 0, k: 0 };
    const r2 = v => Math.round(v * 100) / 100;

    function newState() {
      return { players: {}, ball: { x: FIELD.w / 2, y: FIELD.h / 2, vx: 0, vy: 0, hid: 0 }, score: [0, 0], timeLeft: MATCH_SECS, over: 0, secT: 0, resetIn: 0 };
    }
    function newPlayer(team) {
      return { x: team === 0 ? FIELD.w * 0.25 : FIELD.w * 0.75, y: FIELD.h / 2, vx: 0, vy: 0, ix: 0, iy: 0, kl: 0 };
    }
    function finishState(S) { S.over = S.score[0] > S.score[1] ? 1 : (S.score[1] > S.score[0] ? 2 : 3); }

    // colisão entre dois discos (a, b) estilo HaxBall: separa pela massa e aplica impulso com elasticidade ca*cb
    function collide(a, ra, ia, ca, b, rb, ib, cb) {
      let dx = b.x - a.x, dy = b.y - a.y;
      const rs = ra + rb, d2 = dx * dx + dy * dy;
      if (d2 > rs * rs) return 0;
      const d = Math.sqrt(d2);
      const nx = d > 0 ? dx / d : 1, ny = d > 0 ? dy / d : 0;
      const mf = ia / (ia + ib), pen = rs - d;
      a.x -= nx * pen * mf; a.y -= ny * pen * mf;
      b.x += nx * pen * (1 - mf); b.y += ny * pen * (1 - mf);
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv < 0) {
        const j = rv * (ca * cb + 1);
        a.vx += nx * j * mf; a.vy += ny * j * mf;
        b.vx -= nx * j * (1 - mf); b.vy -= ny * j * (1 - mf);
        return -rv;
      }
      return 0;
    }

    function stepSim(S, ins, auth, ev) {
      if (S.over) return;
      const B = S.ball, ids = Object.keys(S.players), P = ids.map(id => S.players[id]);
      const gt = (FIELD.h - FIELD.goal) / 2, gb = gt + FIELD.goal;

      for (let i = 0; i < P.length; i++) {
        const p = P[i], inp = ins[ids[i]] || ZERO_IN;
        let x = +inp.x || 0, y = +inp.y || 0;
        const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
        p.ix = x; p.iy = y;
        p.vx += x * PH.accel; p.vy += y * PH.accel;
        if (!inp.k) p.kl = 0;
        else if (!p.kl && !B.hid) {
          const dx = B.x - p.x, dy = B.y - p.y, d = Math.hypot(dx, dy);
          if (d <= PH.r + BL.r + PH.range) {
            const nx = d > 0 ? dx / d : 1, ny = d > 0 ? dy / d : 0;
            B.vx += nx * PH.kick * BL.inv; B.vy += ny * PH.kick * BL.inv;
            p.kl = 1;
            if (ev && ev.kick) ev.kick(ids[i]);
          }
        }
      }
      for (const p of P) { p.x += p.vx; p.y += p.vy; p.vx *= PH.damp; p.vy *= PH.damp; }
      if (!B.hid) { B.x += B.vx; B.y += B.vy; B.vx *= BL.damp; B.vy *= BL.damp; }

      for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) collide(P[i], PH.r, PH.inv, PH.bc, P[j], PH.r, PH.inv, PH.bc);
      if (!B.hid) for (const p of P) collide(p, PH.r, PH.inv, PH.bc, B, BL.r, BL.inv, BL.bc);

      for (const p of P) {
        if (p.x < PH.r) { p.x = PH.r; if (p.vx < 0) p.vx = 0; }
        if (p.x > FIELD.w - PH.r) { p.x = FIELD.w - PH.r; if (p.vx > 0) p.vx = 0; }
        if (p.y < PH.r) { p.y = PH.r; if (p.vy < 0) p.vy = 0; }
        if (p.y > FIELD.h - PH.r) { p.y = FIELD.h - PH.r; if (p.vy > 0) p.vy = 0; }
      }

      if (!B.hid) {
        let goalFor = -1;
        if (B.y - BL.r < 0) { B.y = BL.r; if (B.vy < 0) { if (ev && ev.bounce) ev.bounce(-B.vy); B.vy *= -BL.wall; } }
        if (B.y + BL.r > FIELD.h) { B.y = FIELD.h - BL.r; if (B.vy > 0) { if (ev && ev.bounce) ev.bounce(B.vy); B.vy *= -BL.wall; } }
        if (B.x - BL.r < 0) {
          if (B.y > gt && B.y < gb) goalFor = 1;
          else { B.x = BL.r; if (B.vx < 0) { if (ev && ev.bounce) ev.bounce(-B.vx); B.vx *= -BL.wall; } }
        }
        if (B.x + BL.r > FIELD.w) {
          if (B.y > gt && B.y < gb) goalFor = 0;
          else { B.x = FIELD.w - BL.r; if (B.vx > 0) { if (ev && ev.bounce) ev.bounce(B.vx); B.vx *= -BL.wall; } }
        }
        if (goalFor >= 0) {
          B.hid = 1; B.vx = 0; B.vy = 0;
          if (auth) {
            S.score[goalFor]++; S.resetIn = GOAL_PAUSE;
            if (ev && ev.goal) ev.goal(goalFor);
            if (S.score[goalFor] >= MAX_SCORE) finishState(S);
          }
        }
      }

      if (auth && !S.over) {
        if (B.hid && S.resetIn > 0 && --S.resetIn === 0) { B.x = FIELD.w / 2; B.y = FIELD.h / 2; B.vx = 0; B.vy = 0; B.hid = 0; }
        if (++S.secT >= 60) { S.secT = 0; if (--S.timeLeft <= 0) { S.timeLeft = 0; finishState(S); } }
      }
    }

    // ---- host: entradas dos clientes ----
    function hostMetaNew() { return { x: 0, y: 0, k: 0, seq: 0, kn: 0, pulse: 0, at: 0 }; }
    const clamp1 = v => { v = +v; return isFinite(v) ? Math.max(-1, Math.min(1, v)) : 0; };
    function hostOnInput(meta, m, now) {
      if (typeof m.s !== 'number') return;
      if (m.s > meta.seq) { meta.seq = m.s; meta.x = clamp1(m.x); meta.y = clamp1(m.y); meta.k = m.k ? 1 : 0; meta.at = now; }
      if (typeof m.kn === 'number' && m.kn > meta.kn) { meta.kn = m.kn; meta.pulse = 4; }
    }
    function hostIns(meta, now) {
      if (now - meta.at > 400) return ZERO_IN;           // cliente travou/sumiu: para de andar
      const k = (meta.k || meta.pulse > 0) ? 1 : 0;
      if (meta.pulse > 0) meta.pulse--;
      return { x: meta.x, y: meta.y, k };
    }
    function buildSnap(S, n, acks, rv) {
      const B = S.ball, p = [];

      return { ty: 'S', n, tl: S.timeLeft, o: S.over, sc: S.score, h: B.hid, b: [r2(B.x), r2(B.y), r2(B.vx), r2(B.vy)], p, a: acks, rv };
    }

    // ---- cliente: estado vindo do host + repetição das entradas locais ainda não confirmadas (predição) ----

      S.score = sn.sc.slice(); S.timeLeft = sn.tl; S.over = sn.o;
      S.ball = { x: sn.b[0], y: sn.b[1], vx: sn.b[2], vy: sn.b[3], hid: sn.h ? 1 : 0 };
      for (const q of sn.p) S.players[q[0]] = { x: q[1], y: q[2], vx: q[3], vy: q[4], ix: q[5], iy: q[6], kl: q[7] ? 1 : 0 };
      return S;
    }
    // devolve o novo estado "de agora" do cliente e atualiza os deslocamentos de suavização
    function reconcile(G, sn) {

        if (Math.hypot(o[0], o[1]) > 80) { o[0] = 0; o[1] = 0; }
      };
      if (!old.ball.hid && !S2.ball.hid) bump('b', old.ball.x, old.ball.y, S2.ball.x, S2.ball.y); else delete G.off.b;

    /* ==========================================================================================

    function teardown() {

    function newPeer(id, onOpen) {

        if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(t)) fatal('Sem conexão com o servidor. Verifique sua internet e tente de novo.');
      });
      p.on('disconnected', () => { if (gen === genId && !p.destroyed) { try { p.reconnect(); } catch (e) {} } });
      p.on('connection', c => { if (gen === genId && role === 'host') hostOnConnection(c, gen); else { try { c.close(); } catch (e) {} } });

    }

    function generateThreeDigitCode() { let c = ''; for (let i = 0; i < 3; i++) c += Math.floor(Math.random() * 10); return c; }

    window.confirmCreateRoom = function () {

    function createFlow(roomName, tries) {
      teardown(); setBusy(true);

    // tenta entrar como cliente; numa sala pública vazia, vira o host dela
    function connectFlow(hostId, roomName, type, canHost, tries) {
      teardown(); const gen = genId; setBusy(true);
      let settled = false;
      const fail = () => {
        if (settled || gen !== genId) return; settled = true; clearTimeout(connectTm);

          if (gen !== genId || settled) return;

          c.send({ ty: 'J', id: localPlayerId, name: myPlayerName });
        });
        c.on('data', m => { if (gen === genId) onHostMsg(m, gen); });

    // ---------------- lado do host ----------------
    function startHostSession() {
      clearTimeout(connectTm); setBusy(false);
      G = newGame('host'); members = new Map(); sidCounter = 1; hostTick = 0;
      const sid = sidCounter; G.mySid = sid; G.rv = 1;

    function syncRoster() {

    const rosterList = () => [...members.values()].map(m => ({ s: m.sid, id: m.id, n: m.name, t: m.team }));
    function memberByTok(tok) { if (!tok) return null; for (const m of members.values()) if (m.tok === tok) return m; return null; }
    function broadcastCtl(obj) { members.forEach(m => { if (m.ctl && m.ctl.open) { try { m.ctl.send(obj); } catch (e) {} } }); }
    function sendFast(m, obj) {
      const c = (m.fast && m.fast.open) ? m.fast : m.ctl;
      if (!c || !c.open) return;
      const dc = c.dataChannel; if (dc && dc.bufferedAmount > 32768) return;   // não deixa fila crescer (fila = lag)
      try { c.send(obj); } catch (e) {}
    }
    function updateCounts() {   // avisa quem está olhando o lobby, na hora
      if (!currentRoom || currentRoom.type !== 'publica' || role !== 'host') return;
      watchers.forEach(c => { if (c.open) { try { c.send({ ty: 'N', n: members.size }); } catch (e) {} } });
    }
    function removeMember(sid, notice) {
      if (!members.has(sid)) return;
      const mm = members.get(sid);
      if (notice && mm.ctl && mm.ctl.open) { try { mm.ctl.send({ ty: 'K' }); } catch (e) {} setTimeout(() => { try { mm.ctl.close(); } catch (e) {} }, 300); }
      members.delete(sid); delete G.S.players[sid]; G.rv++;
      syncRoster(); broadcastCtl({ ty: 'R', v: G.rv, list: rosterList() });
      updateCounts(); renderPlayersManagement();
    }
    function hostOnConnection(c, gen) {
      if (c.label === 'watch') {
        c.on('open', () => { watchers.add(c); try { c.send({ ty: 'N', n: members.size }); } catch (e) {} });
        const dw = () => watchers.delete(c); c.on('close', dw); c.on('error', dw);
        return;
      }
      if (c.label === 'fast') {
        c.on('open', () => { const m = memberByTok(c.metadata && c.metadata.tok); if (!m) { try { c.close(); } catch (e) {} return; } m.fast = c; });
        c.on('data', d => {
          if (gen !== genId || !d || d.ty !== 'I') return;
          const m = memberByTok(c.metadata && c.metadata.tok); if (m) hostOnInput(m.meta, d, performance.now());
        });
        c.on('close', () => { const m = memberByTok(c.metadata && c.metadata.tok); if (m && m.fast === c) m.fast = null; });
        return;
      }
      c.on('data', d => { if (gen === genId && d) hostOnCtl(c, d); });
      const gone = () => { if (gen !== genId) return; for (const m of members.values()) if (m.ctl === c) { removeMember(m.sid); break; } };
      c.on('close', gone); c.on('error', gone);
    }
    function hostOnCtl(c, d) {
      if (d.ty === 'J') {
        for (const m of members.values()) if (m.ctl === c) return;
        for (const m of [...members.values()]) if (m.id === d.id && m.sid !== G.mySid) removeMember(m.sid);   // mesma pessoa reconectando
        if (members.size >= MAX_PLAYERS_PER_ROOM) { try { c.send({ ty: 'F' }); } catch (e) {} setTimeout(() => { try { c.close(); } catch (e) {} }, 400); return; }
        const sid = ++sidCounter, tok = Math.random().toString(36).slice(2) + Date.now().toString(36);
        let t0 = 0, t1 = 0; members.forEach(m => { if (m.team === 0) t0++; else t1++; });
        const team = t0 <= t1 ? 0 : 1;
        members.set(sid, { sid, id: String(d.id || ''), name: String(d.name || '').trim().slice(0, 15), team, ctl: c, fast: null, meta: Object.assign(hostMetaNew(), { at: performance.now() }), tok });
        G.S.players[sid] = newPlayer(team); G.rv++;
        syncRoster();
        try { c.send({ ty: 'W', sid, tok, team, rv: G.rv, list: rosterList(), snap: buildSnap(G.S, G.snapN, {}, G.rv), chat: chatMessages }); } catch (e) {}
        broadcastCtl({ ty: 'R', v: G.rv, list: rosterList() });
        updateCounts(); renderPlayersManagement();
      } else if (d.ty === 'L') {
        for (const m of [...members.values()]) if (m.ctl === c) { removeMember(m.sid); break; }
      } else if (d.ty === 'C' && d.m && typeof d.m.text === 'string') {
        const m = { sender: String(d.m.sender || 'Anônimo').slice(0, 15), text: d.m.text.slice(0, 1000), from: String(d.m.from || ''), time: String(d.m.time || '').slice(0, 8) };
        pushChat(m); broadcastCtl({ ty: 'C', m });
      }
    }
    const hostEv = { kick: () => playKickSound(), goal: () => playGoalSound(), bounce: s => playBounceSound(s) };
    function broadcastSnap() {
      const acks = {};
      members.forEach((m, sid) => { if (sid !== G.mySid) acks[sid] = m.meta.seq; });
      const snap = buildSnap(G.S, ++G.snapN, acks, G.rv);
      members.forEach(m => { if (m.sid !== G.mySid) sendFast(m, snap); });
    }

    // ---------------- lado do cliente ----------------
    function onHostMsg(m, gen) {
      if (!m || typeof m.ty !== 'string') return;
      if (m.ty === 'W') {
        if (G) return;
        clearTimeout(connectTm); setBusy(false);
        G = newGame('client'); role = 'client';
        G.mySid = m.sid; G.rv = m.rv; G.roster = new Map(m.list.map(x => [x.s, { id: x.id, n: x.n, t: x.t }]));
        G.S = stateFromSnap(m.snap);
        chatMessages = m.chat || [];
        try {
          const f = peer.connect(currentRoom.hostId, { label: 'fast', reliable: false, serialization: 'json', metadata: { tok: m.tok } });
          fastConn = f;
          f.on('data', d => { if (gen === genId) onHostMsg(d, gen); });
          f.on('close', () => { if (fastConn === f) fastConn = null; });
        } catch (e) { fastConn = null; }
        initGameSession();
      } else if (!G) {
        if (m.ty === 'F') fatal("Esta sala já está cheia (limite de 4 jogadores)!");
      } else if (m.ty === 'S') {
        if (m.n <= G.lastSn) return;
        G.lastSn = m.n; G.lastSnAt = performance.now();
        const oldScore = G.S.score[0] + G.S.score[1];
        const old = reconcile(G, m);
        if (m.sc[0] + m.sc[1] > oldScore) playGoalSound();
        for (const id in G.S.players) { if (+id !== G.mySid && old.players[id] && !old.players[id].kl && G.S.players[id].kl) playKickSound(); }
        const e = G.sentAt[(m.a && m.a[G.mySid]) & 255];
        if (e && m.a && e.s === m.a[G.mySid]) { const rt = G.lastSnAt - e.t; G.rtt = G.rtt ? G.rtt * 0.85 + rt * 0.15 : rt; }
      } else if (m.ty === 'X') { fatal("Partida encerrada: o Host saiu da sala.");
      } else if (m.ty === 'K') { fatal("Você foi desconectado da sala por inatividade.");
      } else if (m.ty === 'R') {
        if (m.v <= G.rv) return;
        G.rv = m.v; G.roster = new Map(m.list.map(x => [x.s, { id: x.id, n: x.n, t: x.t }]));
        for (const id in G.S.players) if (!G.roster.has(+id)) delete G.S.players[id];
        renderPlayersManagement();
      } else if (m.ty === 'C' && m.m) {
        pushChat({ sender: String(m.m.sender), text: String(m.m.text), from: String(m.m.from || ''), time: String(m.m.time || '') });
      }
    }
    function sendInput(msg) {
      const c = (fastConn && fastConn.open) ? fastConn : ctlConn;
      if (!c || !c.open) return;
      const dc = c.dataChannel; if (dc && dc.bufferedAmount > 32768) return;
      try { c.send(msg); } catch (e) {}
    }
    const clientEv = { kick: () => playKickSound(), bounce: s => playBounceSound(s) };

    /* ==========================================================================================
       PARTIDA: laço de jogo, HUD e desenho
       ========================================================================================== */
    function newGame(r) {
      return { role: r, S: newState(), prev: { b: [0, 0], p: {} }, off: {}, seq: 0, log: new Array(256), sentAt: new Array(256),
        mySid: 0, roster: new Map(), rv: 0, lastSn: -1, lastSnAt: performance.now(), rtt: 0, snapN: 0, hud: { y: -1, b: -1, t: -1, o: 0, ping: 0, tick: 0 } };
    }

    function initGameSession() {
      $('lobbyScreen').classList.add('hidden');
      $('mainFooter').classList.add('hidden');
      $('gameScreen').classList.remove('hidden');
      $('victoryModal').classList.add('hidden');
      $('chatDrawer').classList.add('hidden');
      $('playersDrawer').classList.add('hidden');
      $('chatBadge').classList.add('hidden');
      renderChatMessages(); renderPlayersManagement();

      inMatch = true;
      if (audioEnabled) playMatchMusic();

      keys = {}; joy = { x: 0, y: 0 }; kickHeld = 0; kickPulseT = 0; kickCount = 0;

      const codeDisplayEl = $('roomCodeDisplay');
      if (currentRoom.type === 'privada' && currentRoom.code) { $('roomCodeText').innerText = currentRoom.code; codeDisplayEl.style.display = 'flex'; }
      else codeDisplayEl.style.display = 'none';
      $('roomCodeFoot').innerText = (currentRoom.type === 'privada' && currentRoom.code) ? 'CÓD ' + currentRoom.code : '';
      $('roomTitleDisplay').innerText = currentRoom.name || "Partida Online";
      $('pingDisplay').innerText = role === 'host' ? 'HOST' : '';
      $('scoreYellow').innerText = "0"; $('scoreBlack').innerText = "0";

      fitCanvas();
      capturePrev();
      if (role === 'client') {
        watchTm = setInterval(() => { if (G && performance.now() - G.lastSnAt > 8000) fatal("Conexão com o host perdida."); }, 1000);
      }
      startLoop();
    }

    function startLoop() {
      const myGen = genId; let last = performance.now(), acc = 0;
      function frame(ts) {
        if (myGen !== genId || !G) return;
        acc += Math.max(0, Math.min(ts - last, 100)); last = ts;
        let n = 0;
        while (acc >= STEP && n < 6) { acc -= STEP; tickOnce(); n++; }
        if (n === 6) acc = 0;
        render(acc / STEP);
        updateHud();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function capturePrev() {
      const S = G.S, pv = G.prev;
      pv.b = [S.ball.x, S.ball.y]; pv.p = {};
      for (const id in S.players) { const q = S.players[id]; pv.p[id] = [q.x, q.y]; }
    }

    function tickOnce() {
      const S = G.S;
      capturePrev();
      const inp = readInput();
      if (G.role === 'host') {
        const now = performance.now(), ins = {};
        members.forEach((m, sid) => { ins[sid] = sid === G.mySid ? inp : hostIns(m.meta, now); });
        stepSim(S, ins, true, hostEv);
        hostTick++; broadcastSnap();
        if (hostTick % 30 === 0) for (const m of [...members.values()]) if (m.sid !== G.mySid && now - m.meta.at > 5000) removeMember(m.sid, true);   // sumiu sem avisar
      } else {
        const s = ++G.seq;
        G.log[s & 255] = { s, x: inp.x, y: inp.y, k: inp.k };
        G.sentAt[s & 255] = { s, t: performance.now() };
        sendInput({ ty: 'I', s, x: inp.x, y: inp.y, k: inp.k, kn: kickCount });
        const ins = {};
        for (const id in S.players) { const q = S.players[id]; ins[id] = (+id === G.mySid) ? inp : { x: q.ix, y: q.iy, k: 0 }; }
        stepSim(S, ins, false, clientEv);
        for (const key in G.off) { const o = G.off[key]; o[0] *= 0.88; o[1] *= 0.88; }
      }
    }

    function updateHud() {
      const S = G.S, h = G.hud;
      if (h.y !== S.score[0] || h.b !== S.score[1]) { h.y = S.score[0]; h.b = S.score[1]; $('scoreYellow').innerText = h.y; $('scoreBlack').innerText = h.b; }
      if (h.t !== S.timeLeft) {
        h.t = S.timeLeft;
        $('gameTimer').innerText = String(Math.floor(h.t / 60)).padStart(2, '0') + ":" + String(h.t % 60).padStart(2, '0');
      }
      if (S.over && !h.o) { h.o = 1; displayVictoryScreen(S.over); playVictoryTune(); }
      if (G.role === 'client') {
        if (++h.tick % 20 === 0) { const p = Math.round(G.rtt); if (p !== h.ping) { h.ping = p; $('pingDisplay').innerText = 'PING ' + p + ' ms'; } }
      }
    }

    function displayVictoryScreen(winner) {
      const msgEl = $('victoryMessage');
      if (winner === 1) { msgEl.className = "font-black tracking-wide mb-4 uppercase text-yellow-400"; msgEl.innerText = "FIM DE JOGO - VITÓRIA DO TIME AMARELO!"; }
      else if (winner === 2) { msgEl.className = "font-black tracking-wide mb-4 uppercase text-zinc-200"; msgEl.innerText = "FIM DE JOGO - VITÓRIA DO TIME PRETO!"; }
      else { msgEl.className = "font-black tracking-wide mb-4 uppercase text-white"; msgEl.innerText = "FIM DE JOGO - EMPATE!"; }
      $('victoryModal').classList.remove('hidden');
    }

    function notifyLeave() {
      try {
        if (role === 'host') broadcastCtl({ ty: 'X' });
        else if (ctlConn && ctlConn.open) ctlConn.send({ ty: 'L' });
      } catch (e) {}
    }
    window.leaveRoom = function () {
      const g = genId;
      notifyLeave(); showLobby();
      setTimeout(() => { if (g === genId) { teardown(); startLobbyWatch(); } }, 200);   // dá tempo do aviso sair
    };
    window.addEventListener('pagehide', notifyLeave);

    // ---- lobby: contagem de jogadores em tempo real (conexão 'watch' com cada sala pública) ----
    let watch = null;
    function setRoomCount(id, n) {
      if (!watch) return; watch.counts[id] = n;
      const el = $('rc_' + id); if (el) el.innerText = '⚽ ' + n + '/' + MAX_PLAYERS_PER_ROOM + ' jogadores';
    }
    function stopLobbyWatch() {
      if (!watch) return; const w = watch; watch = null; w.dead = true; clearInterval(w.tm);
      try { w.peer.destroy(); } catch (e) {}
    }
    function startLobbyWatch() {
      stopLobbyWatch();
      let p; try { p = new Peer({ config: ICE }); } catch (e) { return; }
      const w = watch = { dead: false, peer: p, conns: {}, counts: {}, tm: null };
      PUBLIC_ROOMS.forEach(r => { w.counts[r.id] = 0; });
      const drop = id => { const c = w.conns[id]; w.conns[id] = null; if (c) { try { c.close(); } catch (e) {} } setRoomCount(id, 0); };
      const tick = () => {
        if (w.dead) return;
        PUBLIC_ROOMS.forEach(r => {
          if (w.conns[r.id]) return;
          const c = p.connect(r.id, { label: 'watch', reliable: true, serialization: 'json' });
          w.conns[r.id] = c;
          const to = setTimeout(() => { if (w.conns[r.id] === c && !c.open) drop(r.id); }, 7000);
          c.on('data', m => { if (!w.dead && m && m.ty === 'N') setRoomCount(r.id, m.n | 0); });
          c.on('close', () => { clearTimeout(to); if (w.conns[r.id] === c) { w.conns[r.id] = null; setRoomCount(r.id, 0); } });
          c.on('error', () => { clearTimeout(to); if (w.conns[r.id] === c) drop(r.id); });
        });
      };
      p.on('open', () => { if (w.dead) return; tick(); w.tm = setInterval(tick, 2000); });
      p.on('error', err => { if (w.dead) return; const mt = /futrok_room_pub_\d/.exec((err && err.message) || ''); if (mt && w.conns[mt[0]]) drop(mt[0]); });
      p.on('disconnected', () => { if (!w.dead && !p.destroyed) { try { p.reconnect(); } catch (e) {} } });
    }

    // ---- desenho ----
    let view = { scale: 1, dpr: 1 };
    const staticLayer = document.createElement('canvas');
    function fitCanvas() {
      const cont = $('canvasContainer'), cw = cont.clientWidth, ch = cont.clientHeight;
      if (cw < 50 || ch < 50) return;
      const scale = Math.min(cw / FIELD.w, ch / FIELD.h);
      const cssW = Math.floor(FIELD.w * scale), cssH = Math.floor(FIELD.h * scale);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
      canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
      view = { scale: cssW / FIELD.w, dpr };
      buildStatic();
    }
    function buildStatic() {
      staticLayer.width = canvas.width; staticLayer.height = canvas.height;
      const c = staticLayer.getContext('2d'), s = view.scale * view.dpr;
      c.setTransform(s, 0, 0, s, 0, 0);
      c.fillStyle = "#18181b"; c.fillRect(0, 0, FIELD.w, FIELD.h);
      c.strokeStyle = "rgba(250, 204, 21, 0.4)"; c.lineWidth = 2;
      c.beginPath(); c.moveTo(FIELD.w / 2, 0); c.lineTo(FIELD.w / 2, FIELD.h); c.stroke();
      c.beginPath(); c.arc(FIELD.w / 2, FIELD.h / 2, 60, 0, Math.PI * 2); c.stroke();
      const gt = (FIELD.h - FIELD.goal) / 2;
      c.fillStyle = "rgba(250, 204, 21, 0.2)"; c.fillRect(0, gt, 12, FIELD.goal);
      c.strokeStyle = "#facc15"; c.strokeRect(0, gt, 12, FIELD.goal);
      c.fillStyle = "rgba(255, 255, 255, 0.1)"; c.fillRect(FIELD.w - 12, gt, 12, FIELD.goal);
      c.strokeStyle = "#ffffff"; c.strokeRect(FIELD.w - 12, gt, 12, FIELD.goal);
    }
    window.addEventListener('resize', () => { if (inMatch) fitCanvas(); });
    window.addEventListener('orientationchange', () => setTimeout(() => { if (inMatch) fitCanvas(); }, 250));
    document.addEventListener('fullscreenchange', () => setTimeout(() => { if (inMatch) fitCanvas(); }, 150));
    if (window.ResizeObserver) new ResizeObserver(() => { if (inMatch) fitCanvas(); }).observe($('canvasContainer'));

    function rp(key, cx, cy, alpha) {
      const pv = key === 'b' ? G.prev.b : G.prev.p[key];
      let x = cx, y = cy;
      if (pv && Math.abs(cx - pv[0]) < 60 && Math.abs(cy - pv[1]) < 60) { x = pv[0] + (cx - pv[0]) * alpha; y = pv[1] + (cy - pv[1]) * alpha; }
      const o = G.off[key]; if (o) { x += o[0]; y += o[1]; }
      return [x, y];
    }
    function render(alpha) {
      const S = G.S, B = S.ball, sc = view.scale * view.dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(staticLayer, 0, 0);
      ctx.setTransform(sc, 0, 0, sc, 0, 0);

      if (!B.hid) {
        const [bx, by] = rp('b', B.x, B.y, alpha);
        ctx.beginPath(); ctx.arc(bx, by, BL.r, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#000000"; ctx.stroke();
      }
      const nameFs = Math.max(10, 13 / view.scale);
      ctx.font = "bold " + nameFs + "px sans-serif"; ctx.textAlign = "center"; ctx.lineJoin = "round";
      for (const id in S.players) {
        const p = S.players[id], info = G.roster.get(+id); if (!info) continue;
        const [x, y] = rp(id, p.x, p.y, alpha);
        ctx.beginPath(); ctx.arc(x, y, PH.r, 0, Math.PI * 2);
        if (info.t === 0) { ctx.fillStyle = "#facc15"; ctx.strokeStyle = "#000000"; } else { ctx.fillStyle = "#000000"; ctx.strokeStyle = "#facc15"; }
        ctx.lineWidth = 3; ctx.fill(); ctx.stroke();
        if (info.n && info.n.trim() !== "") {
          ctx.lineWidth = 3 / view.scale; ctx.strokeStyle = "rgba(0,0,0,0.85)"; ctx.strokeText(info.n, x, y - PH.r - 6);
          ctx.fillStyle = "#ffffff"; ctx.fillText(info.n, x, y - PH.r - 6);
        }
      }
    }

    window.refreshRoomList = function () {
      const listEl = $('roomList'), counts = watch ? watch.counts : {};
      listEl.innerHTML = PUBLIC_ROOMS.map(r => {
        const n = counts[r.id] || 0;
        return `
          <div class="room-card">
            <div class="room-badge">${r.num}</div>
            <div class="grow min-w-0">
              <div class="room-name">${r.name}</div>
              <div class="room-sub" id="rc_${r.id}">⚽ ${n}/${MAX_PLAYERS_PER_ROOM} jogadores</div>
            </div>
            <button onclick="window.joinPublicRoom('${r.id}', '${r.name}')" class="room-go btn-yellow">Entrar</button>
          </div>`;
      }).join('');
    };

    window.onload = () => {
      window.refreshRoomList(); startLobbyWatch();
      if (isTouchDevice) { joystickBase.style.display = 'block'; kickBtn.style.display = 'flex'; }
    };
  </script>
</body>
</html>
